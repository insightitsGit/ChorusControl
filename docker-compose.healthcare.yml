# Aurora Health — full-stack local demo
# Mother + Postgres audit + clinical / pharmacy / edge agents + scenario seed
#
#   docker compose -f docker-compose.healthcare.yml up --build
#
# UI: http://127.0.0.1:8443/overview
# Auth: Authorization: Bearer healthcare-demo-token

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cc
      POSTGRES_PASSWORD: cc
      POSTGRES_DB: choruscontrol
    ports:
      - "5432:5432"
    volumes:
      - hc_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cc -d choruscontrol"]
      interval: 5s
      timeout: 3s
      retries: 10

  mother:
    build: .
    ports:
      - "8443:8443"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      CHORUSCONTROL_DEMO_MODE: "1"
      CHORUSCONTROL_ADMIN_TOKEN: "healthcare-demo-token"
      CHORUSCONTROL_SQLITE_PATH: /data/mother.db
      CHORUSCONTROL_AUDIT_LOG_PATH: /data/audit.jsonl
      CHORUSCONTROL_TRANSPORT_PRIMARY: http
      CHORUSCONTROL_ALLOW_INSECURE_EXTERNAL: "1"
      CHORUSCONTROL_LEDGER_SAMPLE_RATE: "1.0"
      CHORUSCONTROL_METRICS_SAMPLE_INTERVAL: "5"
      DATABASE_URL: postgresql://cc:cc@postgres:5432/choruscontrol
      CHORUSGRAPH_LICENSE_KEY: ""
      PRISMGUARD_LICENSE_KEY: ""
    volumes:
      - hc_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8443/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 15

  seed:
    build: .
    depends_on:
      mother:
        condition: service_healthy
    environment:
      CHORUSCONTROL_MOTHER_URL: http://mother:8443
      CHORUSCONTROL_ADMIN_TOKEN: "healthcare-demo-token"
      JOIN_TOKEN_FILE: /shared/join_token
    volumes:
      - hc_shared:/shared
    entrypoint: ["python", "scripts/healthcare_demo_seed.py"]
    restart: "no"

  agent-clinical:
    build:
      context: .
      dockerfile: Dockerfile.agent
    depends_on:
      seed:
        condition: service_completed_successfully
    environment:
      CHORUSCONTROL_MOTHER_URL: http://mother:8443
      CHORUSCONTROL_NODE_ID: aurora-clinical-green
      CHORUSCONTROL_NODE_ROLE: GREEN
      CHORUSCONTROL_TENANT_ID: aurora-health
      CHORUSCONTROL_NETWORK_ZONE: in_vpc
      CHORUSCONTROL_HEARTBEAT_INTERVAL: "5"
      JOIN_TOKEN_FILE: /shared/join_token
    volumes:
      - hc_shared:/shared
    entrypoint:
      [
        "/bin/sh",
        "-c",
        "export CHORUSCONTROL_JOIN_TOKEN=$$(cat /shared/join_token) && exec choruscontrol-agent",
      ]

  agent-pharmacy:
    build:
      context: .
      dockerfile: Dockerfile.agent
    depends_on:
      seed:
        condition: service_completed_successfully
    environment:
      CHORUSCONTROL_MOTHER_URL: http://mother:8443
      CHORUSCONTROL_NODE_ID: aurora-pharmacy-blue
      CHORUSCONTROL_NODE_ROLE: BLUE
      CHORUSCONTROL_TENANT_ID: aurora-pharmacy
      CHORUSCONTROL_NETWORK_ZONE: in_vpc
      CHORUSCONTROL_HEARTBEAT_INTERVAL: "5"
      JOIN_TOKEN_FILE: /shared/join_token
    volumes:
      - hc_shared:/shared
    entrypoint:
      [
        "/bin/sh",
        "-c",
        "export CHORUSCONTROL_JOIN_TOKEN=$$(cat /shared/join_token) && exec choruscontrol-agent",
      ]

  agent-edge-clinic:
    build:
      context: .
      dockerfile: Dockerfile.agent
    depends_on:
      seed:
        condition: service_completed_successfully
    environment:
      CHORUSCONTROL_MOTHER_URL: http://mother:8443
      CHORUSCONTROL_NODE_ID: aurora-edge-orange
      CHORUSCONTROL_NODE_ROLE: ORANGE
      CHORUSCONTROL_TENANT_ID: aurora-health
      CHORUSCONTROL_NETWORK_ZONE: external
      CHORUSCONTROL_HEARTBEAT_INTERVAL: "5"
      JOIN_TOKEN_FILE: /shared/join_token
    volumes:
      - hc_shared:/shared
    entrypoint:
      [
        "/bin/sh",
        "-c",
        "export CHORUSCONTROL_JOIN_TOKEN=$$(cat /shared/join_token) && exec choruscontrol-agent",
      ]

volumes:
  hc_data:
  hc_shared:
  hc_pgdata:
