[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "choruscontrol"
version = "0.1.0"
description = "ChorusControl — AI Operations Platform for the Prism / Chorus stack"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Insight IT Solutions LLC" }]
dependencies = [
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "cryptography>=42.0",
  "httpx>=0.27",
  "PyJWT>=2.8",
]

[project.optional-dependencies]
server = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "aiosqlite>=0.20",
  "greenlet>=3.0",
  "websockets>=12.0",
]
prism = [
  "chorusgraph==1.3.0",
  "prismguard[prism,guard-model]==0.1.10",
  "prismshine==0.2.2",
  "prismrag-patch[graph]==0.2.1",
  "prismcortex==0.3.0",
]
agent = [
  "httpx>=0.27",
]
postgres = [
  "asyncpg>=0.29",
]
fabric = [
  "chorus-fabric>=0.2.0",
]
all = [
  "choruscontrol[server,agent,postgres,prism]",
]
packaging = [
  "build>=1.2",
  "twine>=5.0",
]
dev = [
  "choruscontrol[server,agent,prism]",
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "anyio>=4.4",
]

[project.scripts]
choruscontrol = "choruscontrol.cli:main"
choruscontrol-agent = "choruscontrol.agent.runtime:main"
choruscontrol-keygen = "choruscontrol.license.keygen:main"

[tool.hatch.build.targets.wheel]
packages = ["choruscontrol"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
