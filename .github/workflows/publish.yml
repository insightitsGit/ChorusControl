name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Ruff
        run: python -m ruff check choruscontrol tests
      - name: Pytest
        run: python -m pytest -q
      - name: Build + twine check
        run: |
          python -m pip install -U build twine
          python -m build
          twine check dist/*
          python scripts/inspect_wheel.py

  build-publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install -U pip build twine
          python -m build
          twine check dist/*
          python scripts/inspect_wheel.py
      # Primary release path today is local twine. CI upload is optional:
      # - set repo secret PYPI_API_TOKEN, or
      # - configure Trusted Publisher on pypi.org (owner insightitsGit, workflow publish.yml)
      - name: Publish to PyPI (API token)
        if: startsWith(github.ref, 'refs/tags/v') && secrets.PYPI_API_TOKEN != ''
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
      - name: Publish to PyPI (Trusted Publisher)
        if: startsWith(github.ref, 'refs/tags/v') && secrets.PYPI_API_TOKEN == ''
        continue-on-error: true
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
      - name: Publish note
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "Tag verify (test+build) is required. PyPI upload via Actions needs Trusted Publisher or PYPI_API_TOKEN."
          echo "Local twine remains a supported release path — see doc/PACKAGING.md"
